<body>
  <header><div class="brand"><span class="brandmark" aria-hidden="true">↗</span><span>Supreme Trucking Insurance</span></div><span class="badge" data-i18n>Интервью ассистента</span><label class="language-control"><span data-i18n>Язык</span><select id="language-switch" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option></select></label></header>
  <main id="app" class="shell"><div class="loading" role="status"><span class="loader" aria-hidden="true"></span>Загружаем интервью…</div></main>
  <footer><span data-i18n>Подход к работе начинается с конкретных действий.</span><span data-i18n>Без ограничения времени</span></footer>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <script src="/team-assessment/i18n.js"></script>
  <script src="/team-assessment/application.js"></script>
<script>
    'use strict';
    const app=document.getElementById('app');
    const announcement=document.getElementById('announcement');
    const state={session:null,bank:null,index:0,followupIndex:0,busy:false,view:'loading',results:null,drafts:{},error:'',focusAfterRender:false};
    const own=(object,key)=>Object.prototype.hasOwnProperty.call(object||{},key);
    function el(tag,attrs={},...children){const node=document.createElement(tag);for(const [key,value] of Object.entries(attrs)){if(value===undefined||value===null)continue;if(key==='class')node.className=value;else if(key==='text')node.textContent=value;else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);else if(key==='disabled'||key==='checked')node[key]=!!value;else node.setAttribute(key,value);}for(const child of children.flat()){if(child===null||child===undefined)continue;node.append(child instanceof Node?child:document.createTextNode(String(child)));}return node;}
    function button(text,kind,handler,disabled=false){return el('button',{type:'button',class:'btn '+kind,onclick:handler,disabled},text);}
    function say(text){announcement.textContent=text;}
    function errorText(error){return error&&error.message?error.message:tr('Не удалось сохранить данные. Проверьте соединение и попробуйте ещё раз.');}
    async function api(path,method='GET',body){let response;try{response=await fetch(path.replace('/api/', '/api/team-assessment/'),{method,credentials:'same-origin',headers:{'X-UI-Language':language,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});}catch(_){throw new Error(tr('Нет соединения с сервером. Ответы на этом экране сохранены здесь — попробуйте ещё раз.'));}let result={};try{result=await response.json();}catch(_){}if(!response.ok){const error=new Error(typeof result.error==='string'?tr(result.error):typeof result.message==='string'?result.message:tr('Сервер не смог выполнить действие. Попробуйте ещё раз.'));error.status=response.status;throw error;}return result;}
    function questions(){const all=[...(state.bank?.warmups||[]),...(state.bank?.questions||[]),...(state.bank?.visuals||[])];const byId=new Map(all.map(q=>[q.id,q]));const order=state.session?.question_order;if(Array.isArray(order)&&order.length){const sorted=order.map(id=>byId.get(id)).filter(Boolean);for(const q of all)if(!sorted.some(x=>x.id===q.id))sorted.push(q);return sorted;}return all;}
    function orderedOptions(q){const order=state.session?.option_order?.[q.id];if(!Array.isArray(order))return q.options||[];const options=order.map(id=>(q.options||[]).find(o=>o.id===id)).filter(Boolean);for(const o of q.options||[])if(!options.some(x=>x.id===o.id))options.push(o);return options;}
    function currentDraft(q){if(!own(state.drafts,q.id))state.drafts[q.id]={answer:own(state.session.answers,q.id)?state.session.answers[q.id]:undefined,note:state.session.notes?.[q.id]||''};return state.drafts[q.id];}
    function errorBox(){return state.error?el('div',{class:'error',role:'alert'},state.error):null;}
    function focusTitle(){if(state.focusAfterRender){state.focusAfterRender=false;requestAnimationFrame(()=>{const heading=app.querySelector('h1,h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});});}}
    function render(){localizeChrome();document.getElementById('language-switch').disabled=state.busy;app.replaceChildren();if(state.view==='intro'&&SupremeCareers.requested())SupremeCareers.renderIntro({app,state,el,render,accept,selectView});else if(state.view==='intro')renderIntro();else if(state.view==='question')renderQuestion();else if(state.view==='review')renderReview();else if(state.view==='followup')renderFollowup();else if(state.view==='complete')renderComplete();else if(state.view==='load-error')renderLoadError();else app.append(el('div',{class:'loading',role:'status'},el('span',{class:'loader','aria-hidden':'true'}),tr('Загружаем интервью…')));if(state.view!=='intro')SupremeCareers.banner({app,state,el,api,accept,render});focusTitle();}
    function accept(data){if(data.bank)state.bank=data.bank;if(data.session){if(state.session?.id!==data.session.id)state.results=null;state.session=data.session;}}
