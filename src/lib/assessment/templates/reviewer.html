<!doctype html>
<html lang="ru"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n>Кабинет владельца · Рабочие ситуации</title>
<style>
:root{--ink:#172a37;--muted:#65766f;--green:#28664f;--line:#dce4de;--paper:#f5f6f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 16px;color:var(--ink)}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a9d5b8;outline-offset:2px}.primary{background:var(--green);color:white;border-color:var(--green)}header{border-bottom:1px solid var(--line);background:#fff;padding:20px 4vw;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:750;letter-spacing:-.5px}.tag{font-size:12px;color:var(--green);background:#e7eee7;border-radius:20px;padding:5px 10px}.wrap{max-width:1440px;margin:38px auto;padding:0 4vw}h1{font-size:36px;line-height:1.2;letter-spacing:-1px;margin:0 0 12px}h2{font-size:21px;line-height:1.4}h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.login{max-width:520px;margin:80px auto}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0 20px}.layout{display:grid;grid-template-columns:280px 1fr;gap:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:26px}.sessions{display:flex;flex-direction:column;gap:10px}.session{text-align:left;padding:16px;background:#fff}.session.active{border:2px solid var(--green);background:#edf4ed}.session strong,.session span{display:block}.small{font-size:12px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.score{padding:20px;border:1px solid var(--line);border-radius:14px;background:#f9fbf7}.value{font-size:42px;line-height:1.3;letter-spacing:-2px;font-weight:700}.value small{font-size:15px;font-weight:400;letter-spacing:0;color:var(--muted)}.level{display:inline-block;background:#e6efe4;border-radius:6px;padding:3px 8px;font-size:12px}.notice{background:#f0f3e9;border-left:3px solid #a1b887;padding:14px 18px;border-radius:0 10px 10px 0;font-size:13px}.warning{background:#fff5dd;border-left-color:#d2a24d}details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650}blockquote{margin:12px 0;padding:12px 16px;background:#f6f7f2;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.answer{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:12px}#message{margin:12px 0;color:#8a432f}#message:empty{display:none}[hidden]{display:none!important}footer{padding:26px 0;color:var(--muted);font-size:12px}.empty{padding:50px 24px;text-align:center;color:var(--muted)}.question-key{font-size:12px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.scores{grid-template-columns:1fr}.wrap{margin-top:24px}.card{padding:20px}h1{font-size:28px}}@media print{header,#login,#sidebar,.toolbar,.actions,#message,footer,#noteEditor{display:none!important}.wrap{margin:0;padding:0}.layout{display:block}.card{border:0;padding:0}.scores{grid-template-columns:repeat(3,1fr)}details{break-inside:avoid}body{background:white;font-size:11px}h1{font-size:24px}.value{font-size:30px}.notice{font-size:10px}}
.language-control{display:flex;align-items:center;gap:8px;font-size:12px;margin-left:auto}.language-control select{font:inherit;color:inherit;background:white;border:1px solid #cdd8d1;border-radius:9px;padding:8px 10px;min-height:38px;max-width:145px}.language-control select:focus-visible{outline:3px solid #82bda6;outline-offset:2px}header{flex-wrap:wrap}.language-control select:disabled{opacity:.6}@media(max-width:480px){.language-control{font-size:11px}.language-control>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}header .badge{display:none}}
</style></head><body>
<header><div class="brand"><span>Supreme Trucking Insurance</span> <span class="tag" data-i18n>Кабинет владельца</span></div><button id="logout" hidden data-i18n>Выйти</button><label class="language-control"><span data-i18n>Язык</span><select id="language-switch" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option></select></label></header>
<main class="wrap"><a href="/admin" data-i18n>Кабинет владельца</a> · <a href="/team-assessment?new=1" target="_blank" rel="noopener" data-i18n>Открыть тест для сотрудника</a><div id="message" role="alert"></div>
<section id="workspace" hidden><div class="toolbar"><div><h1 data-i18n>Сотрудники</h1><div class="muted" data-i18n>Три направления · факты из ответов · вопросы для проверки</div></div><button id="refresh" data-i18n>Обновить</button></div><div class="layout"><aside id="sidebar"><div id="sessionList" class="sessions"></div></aside><article id="detail" class="card"><div class="empty" data-i18n>Выберите сессию, чтобы открыть отчёт.</div></article></div></section>
<footer data-i18n>Пилотная версия. Оценка относится к выбранным ответам. Решение о найме принимает человек.</footer></main>
<script src="/team-assessment/i18n.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);let current=null;let selectedId=null;const noteDrafts={};
const labels={questions:'Основные вопросы',followups:'Пояснения',completed:'Завершено'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function clear(n){n.replaceChildren()}
function message(s=''){ $('#message').textContent=s }
async function api(path,method='GET',body){const r=await fetch(path.replace('/api/', '/api/team-assessment/'),{method,headers:{'X-UI-Language':language,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json();if(!r.ok){if(r.status===401&&path!='/api/admin/login')showLogin();throw new Error(tr(data.error)||tr('Не удалось загрузить данные.'))}return data}
function showLogin(){window.location.assign('/admin/login?next=assessments')}
function showWorkspace(){ $('#workspace').hidden=false;$('#logout').hidden=false }
function date(s){return new Date(s).toLocaleString(language==='ru'?'ru-RU':language==='es'?'es-ES':'en-US',{dateStyle:'short',timeStyle:'short'})}
async function refresh(){message();try{const data=await api('/api/admin/sessions');showWorkspace();const root=$('#sessionList');clear(root);if(!data.sessions.length){root.append(el('div',tr('Здесь появятся сохранённые ответы.'),'empty'));clear($('#detail'));$('#detail').append(el('div',tr('Пока нет сессий. Откройте страницу кандидата, чтобы пройти тест.'),'empty'));return}for(const s of data.sessions){const b=el('button',undefined,'session'+(s.id===selectedId?' active':''));b.append(el('strong',s.name||tr('Без имени')),el('span',s.id,'small muted'),el('span',tr(labels[s.status])||s.status,'small'),el('span',date(s.updated_at),'small muted'));b.onclick=()=>load(s.id);root.append(b)}if(selectedId&&data.sessions.some(s=>s.id===selectedId))await load(selectedId);else await load(data.sessions[0].id)}catch(e){message(e.message)}}
async function load(id){try{current=await api('/api/admin/session/'+encodeURIComponent(id));selectedId=id;render();for(const b of document.querySelectorAll('.session'))b.classList.toggle('active',b.textContent.includes(id))}catch(e){message(e.message)}}
function sectionTitle(root,title){root.append(el('h2',title))}
function render(){const {session:s,report:r,bank}=current;const root=$('#detail');clear(root);root.append(el('div',s.id+' · '+tr(labels[s.status]),'small muted'),el('h1',s.name||tr('Кандидат без имени')));const meta=el('div',undefined,'meta muted small');meta.append(el('span',tr('Начало: ')+date(s.created_at)),el('span',tr('Банк: ')+r.bank_version),el('span',tr('Правила: ')+r.rule_version));root.append(meta);if(s.status!=='completed')root.append(el('p',tr('Сессия ещё не завершена. Ответы и оценки могут измениться.'),'notice warning'));
const scores=el('div',undefined,'scores');for(const [key,t]of Object.entries(r.traits)){const c=el('div',undefined,'score');c.append(el('h3',t.label));const v=el('div',t.score===null?'—':String(t.score),'value');v.append(el('small',' / 100'));c.append(v,el('span',t.level===null?tr('Недостаточно данных'):tr('Уровень ответов ')+t.level,'level'));c.append(el('div',t.answered+tr(' из 6 · ')+t.raw_sum+tr(' баллов по ключу'),'small muted'));const meter=el('meter');meter.min=0;meter.max=100;meter.value=t.score??0;meter.style.width='100%';meter.setAttribute('aria-label',t.label);if(t.score!==null)c.append(meter);if(t.mixed)c.append(el('p',tr('Есть выборы на 1 и на 3 балла. Смотрите контекст.'),'small'));scores.append(c)}root.append(scores);
root.append(el('p',r.notice,'notice'));const overall=r.overall===null?tr('Общий score недоступен: есть пропущенные оцениваемые вопросы.'):tr('Общий score: ')+r.overall+tr('/100. Три направления имеют равные веса.');root.append(el('p',overall,'small muted'));
const explanation=el('details');explanation.append(el('summary',tr('Как читать баллы и уровни')));explanation.append(el('p',tr('Каждый выбор получает 1–3 балла. По шести вопросам: score = (сумма − 6) / 12 × 100. Уровень — ближайший якорь среднего балла: сумма 6–8 → 1; 9–14 → 2; 15–18 → 3. Это предварительные правила пилота, их точность ещё не проверена.'),'small'));explanation.append(el('p',tr('1 — в выбранных действиях больше опоры на заданный порядок. 2 — самостоятельные действия в рамках роли. 3 — действия с более сложными зависимостями и последствиями. Для ambition оцениваются самостоятельность и последовательность развития. Уровень не означает готовность к определённой должности.'),'small'));root.append(explanation);
sectionTitle(root,tr('Что стоит уточнить'));if(!r.flags.length)root.append(el('p',tr('Заданные пары не выявили резких расхождений. Это не подтверждение честности или устойчивости поведения.'),'muted'));for(const f of r.flags){const box=el('div',undefined,'notice warning');box.append(el('strong',f.items.join(' / ')),el('p',f.prompt),el('div',f.reason,'small'));root.append(box)}
sectionTitle(root,tr('Пояснения кандидата'));if(!s.followups.length)root.append(el('p',tr('Пояснения ещё не запрошены.'),'muted'));for(const f of s.followups){root.append(el('h3',f.prompt),el('blockquote',s.followup_answers[f.id]||tr('Ответ не предоставлен.')))}
sectionTitle(root,tr('Основания по каждому направлению'));for(const t of Object.values(r.traits)){const group=el('details');group.append(el('summary',t.label+' · '+(t.score===null?tr('недостаточно данных'):t.score+'/100')));for(const d of t.details){const item=el('div',undefined,'answer');item.append(el('h3',d.id+' · '+(d.score===null?tr('пропуск'):d.score+tr(' из 3'))),el('p',d.prompt),el('blockquote',d.text||tr('Ответ пропущен.')),el('p',d.rationale,'small muted'));if(s.notes[d.id])item.append(el('p',tr('Пояснение к выбору: ')+s.notes[d.id]));const key=el('details');key.append(el('summary',tr('Все варианты и ключ')));const q=bank.questions.find(q=>q.id===d.id);for(const o of q.options)key.append(el('p',o.id+' · '+o.score+tr(' балл(а): ')+o.text+' — '+o.rationale,'question-key'));item.append(key);group.append(item)}root.append(group)}
const warm=el('details');warm.append(el('summary',tr('Вводные вопросы · без баллов')));for(const q of bank.warmups){const o=q.options.find(o=>o.id===s.answers[q.id]);warm.append(el('h3',q.prompt),el('p',o?o.text:tr('Пропуск')));if(s.notes[q.id])warm.append(el('p',s.notes[q.id],'muted'))}if(bank.warmups.length)root.append(warm);
if(current.visual?.items.length){const v=current.visual;sectionTitle(root,v.labels.title);root.append(el('p',v.labels.note,'notice'));for(const item of v.items){root.append(el('h3',item.trait?item.title:v.labels.preference),el('blockquote',item.choice),el('p',item.explanation,'small muted'));if(item.note)root.append(el('p',item.note));}}
const savedNote=el('div');savedNote.append(el('h2',tr('Заметка владельца')));const note=el('textarea');note.id='reviewNote';note.maxLength=10000;note.value=noteDrafts[s.id]??s.review_note??'';note.oninput=()=>noteDrafts[s.id]=note.value;note.setAttribute('aria-label',tr('Заметка владельца'));const editor=el('div');editor.id='noteEditor';editor.append(note);const save=el('button',tr('Сохранить заметку'),'primary');save.onclick=async()=>{save.disabled=true;try{await api('/api/admin/session/'+s.id,'PATCH',{review_note:note.value});s.review_note=note.value;delete noteDrafts[s.id];render();message(tr('Заметка сохранена.'))}catch(e){message(e.message)}finally{save.disabled=false}};editor.append(save);savedNote.append(editor);if(s.review_note)savedNote.append(el('blockquote',s.review_note));root.append(savedNote);
const actions=el('div',undefined,'actions');const json=el('button',tr('Скачать JSON'));json.onclick=()=>download(s.id+'.json',JSON.stringify(current,null,2),'application/json');const md=el('button',tr('Скачать отчёт'));md.onclick=()=>download(s.id+'.md',markdown(),'text/markdown');const print=el('button',tr('Печать / PDF'));print.onclick=()=>{const ds=[...root.querySelectorAll('details')];const old=ds.map(d=>d.open);ds.forEach(d=>d.open=true);window.print();ds.forEach((d,i)=>d.open=old[i])};actions.append(md,json,print);root.append(actions)}
function download(name,text,type){const a=el('a');const u=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function markdown(){const {session:s,report:r}=current;const lines=[tr('# Профиль ответов: ')+(s.name||s.id),'',s.id+' · '+r.bank_version+' · '+r.rule_version,'',r.notice,'',tr('Статус: ')+tr(labels[s.status]),'',tr('| Направление | Score | Уровень ответов |'),'|---|---:|---:|'];for(const t of Object.values(r.traits))lines.push('| '+t.label+' | '+(t.score===null?tr('НД'):t.score) +' | '+(t.level===null?tr('НД'):t.level)+' |');lines.push('',tr('Общий score: ')+(r.overall===null?tr('НД'):r.overall),'',tr('## Расхождения для уточнения'));for(const f of r.flags)lines.push('',f.items.join(' / ')+': '+f.prompt);if(!r.flags.length)lines.push(tr('Нет сработавших проверок; это не показатель честности.'));lines.push('',tr('## Пояснения'));for(const f of s.followups)lines.push('',f.prompt,'',s.followup_answers[f.id]||tr('Нет ответа.'));for(const t of Object.values(r.traits)){lines.push('','## '+t.label);for(const d of t.details)lines.push('',d.id+': '+d.prompt,'',tr('Выбор: ')+(d.text||tr('Пропуск')),'',tr('Баллы: ')+(d.score??tr('НД'))+'. '+d.rationale,'',s.notes[d.id]?tr('Пояснение: ')+s.notes[d.id]:'')}if(current.visual?.items.length){lines.push('','## '+current.visual.labels.title,'',current.visual.labels.note);for(const item of current.visual.items)lines.push('','### '+item.title,'',item.choice,'',item.explanation,'',item.note||'');}lines.push('',tr('## Заметка владельца'),'',s.review_note||tr('Нет заметки.'));return lines.join('\n')}
$('#refresh').onclick=refresh;$('#logout').onclick=async()=>{try{const r=await fetch('/api/owner-auth/sign-out',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw new Error(tr('Не удалось сохранить данные. Проверьте соединение и попробуйте ещё раз.'));window.location.assign('/admin/login?next=assessments');}catch(e){message(e.message)}};

document.getElementById('language-switch').addEventListener('change',async event=>{
  language=event.target.value;rememberLanguage();localizeChrome();
  const url=new URL(location.href);url.searchParams.set('lang',language);history.replaceState(null,'',url);
  if(current){event.target.disabled=true;try{await refresh()}finally{event.target.disabled=false}}
});
localizeChrome();refresh();
</script></body></html>
